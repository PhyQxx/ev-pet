# 生产环境请设置环境变量: DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
server:
  port: 19081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ev_pet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:ev-pet-secret-key-dev-only-20260}
  expiration: 604800000
